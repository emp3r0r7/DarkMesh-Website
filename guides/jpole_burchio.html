<style>
.pdf-container {
  display: flex;
  justify-content: center;  /* Centra orizzontalmente */
  align-items: center;      /* Centra verticalmente */
  width: 100%;
  min-height: 100vh;        /* Altezza minima tutta la viewport */
  padding: 20px;
  box-sizing: border-box;
}

.pdf-viewer {
  width: 100%;
  max-width: 1200px;        /* Larghezza massima */
  height: 800px;            /* Altezza fissa o adattiva */
  border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1); /* Ombra opzionale */
  border-radius: 8px;       /* Angoli arrotondati opzionali */
}

/* mobile */
@media (max-width: 768px) {
  .pdf-container {
    padding: 10px;
    min-height: 90vh;
  }
